<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentiment Analysis Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 24px 40px;
      border-bottom: 1px solid #2a2a4a;
    }

    header h1 {
      font-size: 1.8rem;
      color: #a78bfa;
      letter-spacing: 1px;
    }

    header p {
      color: #888;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .tab {
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #1a1a2e;
      color: #aaa;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .tab.active {
      background: #a78bfa;
      color: #fff;
      border-color: #a78bfa;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 14px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: border 0.2s;
    }

    textarea:focus { border-color: #a78bfa; }

    button {
      margin-top: 14px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Single result */
    .result-box {
      margin-top: 24px;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      display: none;
    }

    .result-box.positive { background: #0d2b1e; border: 1px solid #22c55e; }
    .result-box.negative { background: #2b0d0d; border: 1px solid #ef4444; }

    .result-emoji { font-size: 3rem; }
    .result-label {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 8px 0;
    }
    .positive .result-label { color: #22c55e; }
    .negative .result-label { color: #ef4444; }

    .result-score { color: #aaa; font-size: 0.95rem; }

    /* Batch results */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #a78bfa;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
    }

    .chart-container {
      max-width: 300px;
      margin: 0 auto 24px;
    }

    .review-list { margin-top: 16px; }

    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
    }

    .review-emoji { font-size: 1.4rem; flex-shrink: 0; }
    .review-text  { flex: 1; font-size: 0.9rem; color: #ccc; }
    .review-score { font-size: 0.8rem; color: #888; margin-top: 4px; }

    .badge {
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-positive { background: #0d2b1e; color: #22c55e; border: 1px solid #22c55e; }
    .badge-negative { background: #2b0d0d; color: #ef4444; border: 1px solid #ef4444; }

    .loading { color: #a78bfa; margin-top: 12px; display: none; }

    #batch-results { display: none; }
  </style>
</head>
<body>

<header>
  <h1>🧠 Sentiment Analysis Dashboard</h1>
  <p>Powered by DistilBERT · Built by Aditya Srivastava</p>
</header>

<div class="container">

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('single')">Single Text</div>
    <div class="tab"        onclick="switchTab('batch')">Batch Reviews</div>
  </div>

  <!-- Single Analysis Panel -->
  <div class="panel active" id="panel-single">
    <div class="card">
      <h2 style="margin-bottom:16px; color:#a78bfa;">Analyse Text</h2>
      <textarea id="single-input" rows="5"
        placeholder="Enter any text, review, or sentence to analyse its sentiment..."></textarea>
      <button onclick="analyseSingle()" id="btn-single">Analyse Sentiment</button>
      <p class="loading" id="loading-single">⏳ Analysing...</p>
    </div>

    <div class="result-box" id="single-result">
      <div class="result-emoji" id="res-emoji"></div>
      <div class="result-label" id="res-label"></div>
      <div class="result-score" id="res-score"></div>
    </div>
  </div>

  <!-- Batch Analysis Panel -->
  <div class="panel" id="panel-batch">
    <div class="card">
      <h2 style="margin-bottom:8px; color:#a78bfa;">Batch Review Analysis</h2>
      <p style="color:#888; font-size:0.85rem; margin-bottom:16px;">
        Enter one review per line. Great for product reviews, survey responses, etc.
      </p>
      <textarea id="batch-input" rows="10"
        placeholder="The product is amazing!&#10;Terrible customer service.&#10;Decent quality for the price.&#10;Would not recommend this at all."></textarea>
      <button onclick="analyseBatch()" id="btn-batch">Analyse All Reviews</button>
      <p class="loading" id="loading-batch">⏳ Analysing batch...</p>
    </div>

    <div id="batch-results">
      <!-- Summary Stats -->
      <div class="card">
        <h3 style="margin-bottom:16px; color:#a78bfa;">Summary</h3>
        <div class="summary-grid" id="summary-grid"></div>
        <div class="chart-container">
          <canvas id="sentimentChart"></canvas>
        </div>
      </div>

      <!-- Individual Results -->
      <div class="card">
        <h3 style="margin-bottom:16px; color:#a78bfa;">Individual Results</h3>
        <div class="review-list" id="review-list"></div>
      </div>
    </div>
  </div>

</div>

<script>
  let chartInstance = null;

  function switchTab(tab) {
    document.querySelectorAll(".tab").forEach((t, i) => {
      t.classList.toggle("active", (i === 0 && tab === "single") || (i === 1 && tab === "batch"));
    });
    document.getElementById("panel-single").classList.toggle("active", tab === "single");
    document.getElementById("panel-batch").classList.toggle("active",  tab === "batch");
  }

  async function analyseSingle() {
    const text = document.getElementById("single-input").value.trim();
    if (!text) return alert("Please enter some text.");

    const btn = document.getElementById("btn-single");
    const loading = document.getElementById("loading-single");
    btn.disabled = true;
    loading.style.display = "block";

    try {
      const res  = await fetch("/analyse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await res.json();

      const box = document.getElementById("single-result");
      box.style.display = "block";
      box.className = "result-box " + data.label.toLowerCase();

      document.getElementById("res-emoji").textContent = data.emoji;
      document.getElementById("res-label").textContent = data.label;
      document.getElementById("res-score").textContent = `Confidence: ${data.score}%`;

    } finally {
      btn.disabled = false;
      loading.style.display = "none";
    }
  }

  async function analyseBatch() {
    const text = document.getElementById("batch-input").value.trim();
    if (!text) return alert("Please enter some reviews.");

    const btn = document.getElementById("btn-batch");
    const loading = document.getElementById("loading-batch");
    btn.disabled = true;
    loading.style.display = "block";

    try {
      const res  = await fetch("/analyse_batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await res.json();

      renderSummary(data.summary);
      renderChart(data.summary);
      renderReviews(data.results);

      document.getElementById("batch-results").style.display = "block";

    } finally {
      btn.disabled = false;
      loading.style.display = "none";
    }
  }

  function renderSummary(s) {
    document.getElementById("summary-grid").innerHTML = `
      <div class="stat-card"><div class="stat-value">${s.total}</div><div class="stat-label">Total Reviews</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#22c55e">${s.positive}</div><div class="stat-label">Positive</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#ef4444">${s.negative}</div><div class="stat-label">Negative</div></div>
      <div class="stat-card"><div class="stat-value">${s.positive_pct}%</div><div class="stat-label">Positive Rate</div></div>
      <div class="stat-card"><div class="stat-value">${s.avg_confidence}%</div><div class="stat-label">Avg Confidence</div></div>
    `;
  }

  function renderChart(s) {
    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById("sentimentChart").getContext("2d");
    chartInstance = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Positive", "Negative"],
        datasets: [{
          data: [s.positive, s.negative],
          backgroundColor: ["#22c55e", "#ef4444"],
          borderWidth: 0
        }]
      },
      options: {
        plugins: {
          legend: { labels: { color: "#ccc" } }
        }
      }
    });
  }

  function renderReviews(results) {
    document.getElementById("review-list").innerHTML = results.map(r => `
      <div class="review-item">
        <div class="review-emoji">${r.emoji}</div>
        <div style="flex:1">
          <div class="review-text">${r.text}</div>
          <div class="review-score">Confidence: ${r.score}%</div>
        </div>
        <span class="badge badge-${r.label.toLowerCase()}">${r.label}</span>
      </div>
    `).join("");
  }
</script>
</body>
</html>
